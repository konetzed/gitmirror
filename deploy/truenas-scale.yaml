# gitmirror on TrueNAS SCALE 24.10 or newer.
# Apps > Discover Apps > the three-dot menu (top right) > Install via YAML. Paste this file, then change the
# two lines marked CHANGE.
services:
  gitmirror:
    image: ghcr.io/konetzed/gitmirror:0.0.1-beta   # a version tag: change it to update the app (:latest also exists, but TrueNAS won't re-pull it)
    container_name: gitmirror
    user: "568:568"                            # TrueNAS's "apps" user: give it ownership of the dataset below
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GITMIRROR_TOKEN: "CHANGE-ME-to-a-long-random-string"   # CHANGE: the setup code you enter when creating your account (also a Bearer token for scripts)
      TZ: "UTC"                                              # your time zone, e.g. America/Chicago
      # GITMIRROR_GITHUB_TOKEN: ""    # optional: lifts GitHub's 60 requests/hour limit
      # Private repos over SSH: put your key at /data/ssh/id_ed25519 (mode 600, owned by the app user), then enable:
      # GIT_SSH_COMMAND: "ssh -i /data/ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/data/known_hosts"
    volumes:
      - /mnt/tank/apps/gitmirror:/data        # CHANGE: the dataset you created for gitmirror's data
